name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: armmint
          POSTGRES_PASSWORD: armmint_test
          POSTGRES_DB: armmint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armmint -d armmint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production execution with PostgreSQL connections
        run: node --import ./tests/register.ts --experimental-test-module-mocks --test lib/server/transaction-engine/production.integration.test.ts
        env:
          ENGINE_TEST_DATABASE_URL: postgres://armmint:armmint_test@localhost:5432/armmint_test
      - name: Telegram flows with PostgreSQL connections
        run: node --import ./tests/register.ts --experimental-test-module-mocks --test lib/server/telegram-interface.integration.test.ts
        env:
          TELEGRAM_TEST_DATABASE_URL: postgres://armmint:armmint_test@localhost:5432/armmint_test
      - name: Google auth and linking with PostgreSQL connections
        run: node --import ./tests/register.ts --experimental-test-module-mocks --test lib/auth.integration.test.ts
        env:
          AUTH_TEST_DATABASE_URL: postgres://armmint:armmint_test@localhost:5432/armmint_test
